    const canvas = document.getElementById('shortsCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Context & Synthesizer
    let audioCtx = null;
    let audioDestNode = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        audioDestNode = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.2, destStream = true) {
      if (!audioCtx || document.getElementById('soundSelect').value === 'muted') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (destStream && audioDestNode) {
          gain.connect(audioDestNode);
        }

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio play error", e);
      }
    }

    // High quality sound effects
    function playTickSound() {
      const soundType = document.getElementById('soundSelect').value;
      if (soundType === 'sync_clock') {
        playTone(900, 'sine', 0.04, 0.25);
        setTimeout(() => playTone(600, 'triangle', 0.03, 0.15), 30);
      } else if (soundType === 'sub_riser') {
        playTone(160, 'sine', 0.12, 0.35);
      } else if (soundType === 'arcade') {
        playTone(1200, 'square', 0.05, 0.12);
      }
    }

    function playVictoryChime() {
      const soundType = document.getElementById('soundSelect').value;
      if (soundType === 'muted') return;

      // Major chord arpeggio chime (C5 -> E5 -> G5 -> C6)
      playTone(523.25, 'triangle', 0.5, 0.3);
      setTimeout(() => playTone(659.25, 'triangle', 0.5, 0.3), 80);
      setTimeout(() => playTone(783.99, 'triangle', 0.6, 0.35), 160);
      setTimeout(() => playTone(1046.50, 'sine', 0.8, 0.4), 260);

    // Viral Presets Data

          { hook: 'LEVEL 2: MEDIUM 🟡', question: 'Name The Country!', media: 'ar', opts: ['Uruguay', 'Greece', 'Argentina', 'Honduras'], correct: 2, timer: 4 },

        ],

    };

    // Active multi-round storage
    let currentRounds = [

    // Built-in High Quality Vector SVG Flags (100% CORS-Safe Data URLs)
    const SVG_FLAGS = {

      ar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect fill="#74acdf" width="800" height="500"/><rect fill="#ffffff" y="166.6" width="800" height="166.6"/><circle fill="#f6b40e" cx="400" cy="250" r="45"/></svg>`,
      ca: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500"><rect fill="#ff0000" width="250" height="500"/><rect fill="#ffffff" x="250" width="500" height="500"/><rect fill="#ff0000" x="750" width="250" height="500"/><circle fill="#ff0000" cx="500" cy="250" r="90"/></svg>`,
      bt: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><polygon fill="#ffcc00" points="0,0 900,0 0,600"/><polygon fill="#ff4e12" points="900,0 900,600 0,600"/><circle fill="#ffffff" cx="450" cy="300" r="100"/></svg>`
    };

    function getFlagSvgUrl(code) {
      const lower = (code || '').trim().toLowerCase();
      if (SVG_FLAGS[lower]) {
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_FLAGS[lower]);
      }
      // Fallback for general flags
      return `https://flagcdn.com/w640/${lower}.png`;
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        localUploadedImage = event.target.result;
        document.getElementById('mediaInput').value = "[Local Uploaded Image]";
        renderCurrentFrame();
      };
      reader.readAsDataURL(file);
    }

    function onModeChange() {
      const mode = document.getElementById('modeSelect').value;
      const mediaGroup = document.getElementById('mediaInputGroup');
      if (mode === 'math' || mode === 'trivia') {
        mediaGroup.classList.add('opacity-50');
      } else {
        mediaGroup.classList.remove('opacity-50');
      }
      renderCurrentFrame();
    }

    function onFormatChange() {
      const format = document.getElementById('formatSelect').value;
      const roundTabs = document.getElementById('roundTabContainer');
      if (format === 'multi3') {
        roundTabs.classList.remove('hidden');
        selectRoundTab(0);
      } else {
        roundTabs.classList.add('hidden');
      }
      renderCurrentFrame();
    }

    function selectRoundTab(idx) {
      saveActiveRoundInputs();

    // Color theme definitions for 1080x1920 canvas
    const THEMES = {

    // Helper: Rounded Rectangle
    function roundRect(ctx, x, y, width, height, radius, fill = true, stroke = true) {
      if (typeof radius === 'number') {
        radius = { tl: radius, tr: radius, br: radius, bl: radius };
      }
      ctx.beginPath();
      ctx.moveTo(x + radius.tl, y);
      ctx.lineTo(x + width - radius.tr, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
      ctx.lineTo(x + width, y + height - radius.br);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
      ctx.lineTo(x + radius.bl, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
      ctx.lineTo(x, y + radius.tl);
      ctx.quadraticCurveTo(x, y, x + radius.tl, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    // Background Particle Elements for dynamic depth
    const PARTICLES = Array.from({ length: 30 }, () => ({
      x: Math.random() * 1080,
      y: Math.random() * 1920,
      radius: Math.random() * 3 + 1.5,
      speedY: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.4 + 0.1
    }));

    /* ==========================================================================
       CANVAS 1080x1920 FRAME RENDER FUNCTION
       ========================================================================== */
    function renderFrame(state) {
      const W = 1080;
      const H = 1920;
      const themeKey = document.getElementById('themeSelect').value || 'cyber_gold';
      const theme = THEMES[themeKey] || THEMES.cyber_gold;

      // 1. Background Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, theme.bgTop);
      grad.addColorStop(0.5, theme.bgMid);
      grad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Subtle radial spotlights for high production value
      const radial = ctx.createRadialGradient(W / 2, 700, 50, W / 2, 700, 650);
      radial.addColorStop(0, theme.accentGlow);
      radial.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, W, H);

      // Floating Ambient Micro-Particles
      PARTICLES.forEach(p => {
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 2. TOP SECTION: Hook Badge & Timer
      // Safe zone top margin: 240px
      const topY = 240;

      // Hook Badge (Left)
      ctx.save();
      ctx.shadowColor = theme.badgeBg;
      ctx.shadowBlur = 24;
      ctx.fillStyle = theme.badgeBg;
      roundRect(ctx, 80, topY, 480, 76, 38, true, false);
      ctx.restore();

      ctx.fillStyle = theme.badgeText;
      ctx.font = '900 36px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.hookText, 80 + 240, topY + 39);

      // Timer Badge (Right)
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 2;
      roundRect(ctx, 800, topY, 200, 76, 38, true, true);
      ctx.fillStyle = state.secondsLeft <= 2 && state.secondsLeft > 0 ? '#f43f5e' : '#ffffff';
      ctx.font = '900 40px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil(state.secondsLeft) + 's', 800 + 100, topY + 40);
      ctx.restore();

      // 3. Glowing Progress Bar
      const barY = topY + 105;
      const barWidth = 920;
      const barHeight = 22;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      roundRect(ctx, 80, barY, barWidth, barHeight, 11, true, false);

      const progressRatio = Math.max(0, Math.min(1, state.progressRatio));
      if (progressRatio > 0) {
        const fillW = Math.max(22, barWidth * progressRatio);
        const barGrad = ctx.createLinearGradient(80, barY, 80 + fillW, barY);
        if (state.secondsLeft <= 2) {
          barGrad.addColorStop(0, '#f97316');
          barGrad.addColorStop(1, '#ef4444');
        } else {
          barGrad.addColorStop(0, '#10b981');
          barGrad.addColorStop(0.5, '#fbbf24');
          barGrad.addColorStop(1, '#f59e0b');
        }
        ctx.save();
        ctx.shadowColor = state.secondsLeft <= 2 ? '#ef4444' : '#fbbf24';
        ctx.shadowBlur = 15;
        ctx.fillStyle = barGrad;
        roundRect(ctx, 80, barY, fillW, barHeight, 11, true, false);
        ctx.restore();
      }

      // 4. CENTER AREA: Media or Question Card
      let questionBoxY = 440;
      const hasMedia = (state.mode === 'flag' || state.mode === 'mystery') && state.mediaSrc;

      if (hasMedia) {
        const mediaW = 600;
        const mediaH = 380;
        const mediaX = (W - mediaW) / 2;
        const mediaY = 400;

        // Media Frame
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 6;
        roundRect(ctx, mediaX, mediaY, mediaW, mediaH, 32, true, true);
        ctx.clip();

        // Draw Image if loaded
        const img = imageCache[state.mediaSrc];
        if (img && img.complete && img.naturalWidth !== 0) {
          if (state.mode === 'mystery' && state.blurAmount > 0) {
            ctx.filter = `blur(${state.blurAmount}px)`;
          } else {
            ctx.filter = 'none';
          }
          // Scale to cover
          const scale = Math.max(mediaW / img.width, mediaH / img.height);
          const drawW = img.width * scale;
          const drawH = img.height * scale;
          const drawX = mediaX + (mediaW - drawW) / 2;
          const drawY = mediaY + (mediaH - drawH) / 2;
          ctx.drawImage(img, drawX, drawY, drawW, drawH);
        } else {
          // Loading placeholder
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(mediaX, mediaY, mediaW, mediaH);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '700 36px Outfit';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Loading Flag / Image...', W / 2, mediaY + mediaH / 2);
        }
        ctx.restore();

        questionBoxY = mediaY + mediaH + 50;
      } else {
        questionBoxY = 480;
      }

      // Question Box Card
      const qBoxW = 920;
      const qBoxH = hasMedia ? 200 : 280;
      const qBoxX = (W - qBoxW) / 2;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 25;
      ctx.fillStyle = theme.boxBg;
      ctx.strokeStyle = theme.boxBorder;
      ctx.lineWidth = 3;
      roundRect(ctx, qBoxX, questionBoxY, qBoxW, qBoxH, 28, true, true);
      ctx.restore();

      // Question Text inside Box (Auto text-wrapping)
      ctx.fillStyle = '#ffffff';
      ctx.font = hasMedia ? '800 46px Outfit, sans-serif' : '900 58px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      wrapAndDrawText(ctx, state.questionText, W / 2, questionBoxY + qBoxH / 2, qBoxW - 60, hasMedia ? 54 : 68);

      // 5. OPTIONS GRID (A, B, C, D)
      const optLabels = ['A', 'B', 'C', 'D'];
      const optW = 920;
      const optH = 118;
      const optGap = 26;
      const optStartY = questionBoxY + qBoxH + 46;

      state.opts.forEach((optText, idx) => {
        const curY = optStartY + idx * (optH + optGap);
        const isRevealed = state.isRevealed;
        const isCorrect = idx === state.correctIdx;

        ctx.save();
        if (isRevealed) {
          if (isCorrect) {
            // High dopamine emerald pulse
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 40;
            ctx.fillStyle = theme.correctBg;
            ctx.strokeStyle = theme.correctBorder;
            ctx.lineWidth = 6;
            roundRect(ctx, 80, curY, optW, optH, 24, true, true);
          } else {
            // Dim wrong options to 35% opacity
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            roundRect(ctx, 80, curY, optW, optH, 24, true, true);
          }
        } else {
          // Normal state
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.lineWidth = 2.5;
          roundRect(ctx, 80, curY, optW, optH, 24, true, true);
        }
        ctx.restore();

        // Option Letter Badge (A/B/C/D)
        const badgeSize = 74;
        const badgeX = 104;
        const badgeY = curY + (optH - badgeSize) / 2;

        ctx.save();
        if (isRevealed && isCorrect) {
          ctx.fillStyle = '#022c22';
          roundRect(ctx, badgeX, badgeY, badgeSize, badgeSize, 18, true, false);
          ctx.fillStyle = '#34d399';
        } else {
          ctx.fillStyle = theme.optLabelBg;
          roundRect(ctx, badgeX, badgeY, badgeSize, badgeSize, 18, true, false);
          ctx.fillStyle = theme.optLabelText;
        }
        ctx.font = '900 38px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(optLabels[idx], badgeX + badgeSize / 2, badgeY + badgeSize / 2);
        ctx.restore();

        // Option Text
        ctx.save();
        if (isRevealed && isCorrect) {
          ctx.fillStyle = '#020617';
        } else if (isRevealed && !isCorrect) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        } else {
          ctx.fillStyle = '#ffffff';
        }
        ctx.font = '800 42px Outfit, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(optText, 206, curY + optH / 2);

        // Checkmark badge if correct and revealed
        if (isRevealed && isCorrect) {
          ctx.fillStyle = '#020617';
          ctx.font = '900 44px Outfit, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('✅', 80 + optW - 36, curY + optH / 2);
        }
        ctx.restore();
      });

      // 6. FOOTER CALL-TO-ACTION (Safe Zone: Above 1720px)
      const footerY = 1760;
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = '800 32px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('COMMENT YOUR SCORE BELOW! 👇', W / 2, footerY);
      ctx.restore();

      // 7. OPTIONAL SAFE ZONE GUIDES (Overlay toggle for creators)
      if (document.getElementById('safeZoneToggle').checked) {
        drawSafeZoneGuides(ctx, W, H);
      }
    }

    // Helper: Multiline text wrapping
    function wrapAndDrawText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = (text || '').split(' ');
      const lines = [];
      let currentLine = words[0] || '';

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);

      const totalH = lines.length * lineHeight;
      const startY = y - totalH / 2 + lineHeight / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, x, startY + i * lineHeight);
      });
    }

    // TikTok / YouTube Shorts Safe Zone Overlays
    function drawSafeZoneGuides(ctx, W, H) {
      ctx.save();
      // Top unsafe zone (search, header)
      ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
      ctx.fillRect(0, 0, W, 200);
      // Bottom unsafe zone (caption, sound, buttons)
      ctx.fillRect(0, H - 240, W, 240);
      // Right unsafe zone (like, comment, share icons)
      ctx.fillRect(W - 160, 200, 160, H - 440);

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 8]);
      ctx.strokeRect(40, 200, W - 200, H - 440);

      ctx.fillStyle = '#ef4444';
      ctx.font = '700 24px Outfit';
      ctx.textAlign = 'center';
      ctx.fillText('SAFE ZONE AREA (CONTENT STAYS HERE)', (W - 160) / 2, 225);
      ctx.restore();
    }

    // Load active state from controls
    function getCurrentState() {
      const mode = document.getElementById('modeSelect').value;
      const format = document.getElementById('formatSelect').value;
      let mediaVal = document.getElementById('mediaInput').value.trim();

      let resolvedMedia = '';
      if (localUploadedImage) {
        resolvedMedia = localUploadedImage;
      } else if (mode === 'flag') {
        resolvedMedia = getFlagSvgUrl(mediaVal);
      } else if (mode === 'mystery') {
        resolvedMedia = mediaVal.startsWith('http') ? mediaVal : 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800';
      }

      // Preload image into cache
      if (resolvedMedia && !imageCache[resolvedMedia]) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => renderCurrentFrame();
        img.src = resolvedMedia;
        imageCache[resolvedMedia] = img;
      }

      return {
        mode: mode,
        format: format,
        hookText: document.getElementById('hookInput').value,
        questionText: document.getElementById('questionInput').value,
        mediaSrc: resolvedMedia,
        opts: [
          document.getElementById('optA').value,
          document.getElementById('optB').value,
          document.getElementById('optC').value,
          document.getElementById('optD').value
        ],
        correctIdx: parseInt(document.getElementById('correctSelect').value) || 0,
        totalSec: parseFloat(document.getElementById('timerInput').value) || 5,
        secondsLeft: parseFloat(document.getElementById('timerInput').value) || 5,
        progressRatio: 1,
        blurAmount: mode === 'mystery' ? 36 : 0,
        isRevealed: false
      };
    }

    function renderCurrentFrame() {
      const state = getCurrentState();
      renderFrame(state);
    }

    /* ==========================================================================
       ANIMATION & VIDEO RECORDING PIPELINE
       ========================================================================== */
    let isProcessing = false;
    let animRequest = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    async function startProduction(shouldRecordVideo = true) {
      if (isProcessing) return;
      initAudio();
      isProcessing = true;

      const format = document.getElementById('formatSelect').value;
      const roundsToPlay = format === 'multi3' ? currentRounds : [getCurrentState()];

      // Update UI buttons
      document.getElementById('btnPreview').disabled = true;
      document.getElementById('btnRecord').disabled = true;
      document.getElementById('btnRecord').classList.add('opacity-50');

      const progressBox = document.getElementById('recordingProgressBox');
      const progressBar = document.getElementById('recordingProgressBar');
      const progressPercent = document.getElementById('recordingPercentText');
      const progressStatus = document.getElementById('recordingStatusText');

      if (shouldRecordVideo) {
        progressBox.classList.remove('hidden');
        progressStatus.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span> Recording 1080p 60FPS Video...`;
        recordedChunks = [];

        // Combine Canvas Video Stream (60fps) + Audio Destination Node Stream
        const canvasStream = canvas.captureStream(60);
        let finalStream = canvasStream;

        if (audioDestNode && audioDestNode.stream && audioDestNode.stream.getAudioTracks().length > 0) {
          const audioTrack = audioDestNode.stream.getAudioTracks()[0];
          finalStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            audioTrack
          ]);
        }

        // Determine supported codec (Chrome/Edge/Firefox WebM VP9/Opus, Safari MP4 H.264)
        let mimeType = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp8,opus';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/mp4';
        }

        mediaRecorder = new MediaRecorder(finalStream, {
          mimeType: mimeType || undefined,
          videoBitsPerSecond: 8000000 // 8 Mbps broadcast 1080p
        });

        mediaRecorder.ondataavailable = e => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          const ext = (mimeType && mimeType.includes('mp4')) ? 'mp4' : 'webm';
          a.download = `shorts-quiz-${timestamp}.${ext}`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1000);

          const notice = document.getElementById('lastDownloadNotice');
          notice.classList.remove('hidden');
          setTimeout(() => notice.classList.add('hidden'), 6000);
        };

        mediaRecorder.start(100); // 100ms chunks
      }

      // Execute sequence of rounds
      const totalRounds = roundsToPlay.length;
      for (let r = 0; r < totalRounds; r++) {
        const roundData = roundsToPlay[r];
        await executeRound(roundData, r, totalRounds, shouldRecordVideo);
      }

      // Finished all rounds
      if (shouldRecordVideo && mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        progressStatus.innerHTML = `✅ Video Export Finished & Downloaded!`;
        progressBar.style.width = '100%';
        progressPercent.innerText = '100%';
        setTimeout(() => progressBox.classList.add('hidden'), 3500);
      }

      // Reset UI state
      isProcessing = false;
      document.getElementById('btnPreview').disabled = false;
      document.getElementById('btnRecord').disabled = false;
      document.getElementById('btnRecord').classList.remove('opacity-50');
      renderCurrentFrame();
    }

    function previewAnimation() {
      startProduction(false);
    }

    // Run single round animation loop
    function executeRound(roundData, roundIndex, totalRounds, isRecording) {
      return new Promise((resolve) => {
        const mode = document.getElementById('modeSelect').value;
        const totalDuration = roundData.timer || 5;
        const revealDuration = 2.2; // 2.2s after timer ends to celebrate
        const totalTime = totalDuration + revealDuration;

        let resolvedMedia = '';
        if (localUploadedImage) {
          resolvedMedia = localUploadedImage;
        } else if (mode === 'flag') {
          resolvedMedia = getFlagSvgUrl(roundData.media);
        } else if (mode === 'mystery') {
          resolvedMedia = (roundData.media && roundData.media.startsWith('http')) ? roundData.media : 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800';
        }

        const state = {
          mode: mode,
          hookText: roundData.hook,
          questionText: roundData.question,
          mediaSrc: resolvedMedia,
          opts: roundData.opts,
          correctIdx: roundData.correct,
          totalSec: totalDuration,
          secondsLeft: totalDuration,
          progressRatio: 1,
          blurAmount: mode === 'mystery' ? 36 : 0,
          isRevealed: false
        };

        const startTime = performance.now();
        let lastTickSecond = totalDuration;
        let chimePlayed = false;

        function step(now) {
          const elapsedSec = (now - startTime) / 1000;
          const timeLeft = Math.max(0, totalDuration - elapsedSec);

          state.secondsLeft = timeLeft;
          state.progressRatio = timeLeft / totalDuration;

          // Sound trigger for each ticking second
          const currentSecondCeil = Math.ceil(timeLeft);
          if (currentSecondCeil < lastTickSecond && currentSecondCeil > 0) {
            playTickSound();
            lastTickSecond = currentSecondCeil;
          }

          // Reveal moment
          if (timeLeft <= 0) {
            state.isRevealed = true;
            state.blurAmount = 0;
            state.progressRatio = 0;
            if (!chimePlayed) {
              playVictoryChime();
              chimePlayed = true;
            }
          } else if (mode === 'mystery') {
            // Smoothly decrease blur as time counts down
            state.blurAmount = Math.max(10, (timeLeft / totalDuration) * 36);
          }

          // Render 1080x1920 Frame
          renderFrame(state);

          // Update Progress Bar in UI if recording
          if (isRecording) {
            const overallElapsed = (roundIndex * totalTime) + elapsedSec;
            const overallTotal = totalRounds * totalTime;
            const pct = Math.min(99, Math.round((overallElapsed / overallTotal) * 100));
            document.getElementById('recordingProgressBar').style.width = pct + '%';
            document.getElementById('recordingPercentText').innerText = pct + '%';
          }

          if (elapsedSec < totalTime) {
            animRequest = requestAnimationFrame(step);
          } else {
            resolve();
          }
        }

        animRequest = requestAnimationFrame(step);
      });
    }

    // Auto-update frame on user inputs
    ['hookInput', 'questionInput', 'mediaInput', 'optA', 'optB', 'optC', 'optD', 'correctSelect', 'timerInput'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', () => {
          saveActiveRoundInputs();
          renderCurrentFrame();
        });
      }
    });

    // Initial render
    loadPreset('math_bodmas');
  </script>
</body>
</html>
